services:
  app:
    build:
      context: .
    image: devops-docker-lab:local
    ports:
      - "8080:8080"
    environment:
      APP_ENV: compose
    restart: unless-stopped
    init: true
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
